[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-check-skill"
version = "0.3.0"
description = "Agent skill that gives any material (DOCX, PDF, LaTeX, Markdown, HTML, text) an explainable AI-writing score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HoneyMeta and AI-check contributors" }]
dependencies = [
  "python-docx>=1.1.0",
  "reportlab>=4.0.0"
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
dev = ["pytest>=8.0.0", "pypdf>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
